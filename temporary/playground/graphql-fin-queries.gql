# Rujira FIN Protocol GraphQL Queries
# Test these queries at: https://preview-api.rujira.network/api/graphiql
# These queries mirror the functionality from the playground script

# =============================================================================
# WORKING QUERIES (No Address Required)
# =============================================================================

# =============================================================================
# HAVE-IT-ALL QUERY: ALL DATA FROM FIN
# =============================================================================

query FinHaveItAll {
  rujira {
    fin {
      id
      address
      tick
      feeTaker
      feeMaker
      feeAddress
      deploymentStatus

      # Asset Base
      assetBase {
        id
        asset
        type
        chain
        metadata {
          symbol
          name
          decimals
          description
          display
        }
        price {
          current
          changeDay
          mcap
          timestamp
        }
        variants {
          layer1 { asset }
          secured { asset }
          native { denom }
        }
      }

      # Asset Quote
      assetQuote {
        id
        asset
        type
        chain
        metadata {
          symbol
          name
          decimals
          description
          display
        }
        price {
          current
          changeDay
          mcap
          timestamp
        }
        variants {
          layer1 { asset }
          secured { asset }
          native { denom }
        }
      }

      # Oracles
      oracleBase {
        id
        asset {
          asset
          metadata { symbol name decimals }
        }
        price
      }
      oracleQuote {
        id
        asset {
          asset
          metadata { symbol name decimals }
        }
        price
      }

      # Contract Info
      contract {
        codeId
        creator
        admin
        label
        created {
          blockHeight
          txIndex
        }
      }

      # Summary
      summary {
        last
        lastUsd
        high
        low
        change
        volume {
          amount
          asset {
            asset
            metadata { symbol name decimals }
          }
          valueUsd
        }
      }

      # Book (Orderbook)
      book {
        center
        spread
        bids {
          price
          total
          side
          value
          virtualTotal
          virtualValue
        }
        asks {
          price
          total
          side
          value
          virtualTotal
          virtualValue
        }
        pair {
          id
          address
        }
      }
    }
  }
}

