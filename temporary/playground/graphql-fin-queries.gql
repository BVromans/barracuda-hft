# =============================================================================
# 5. GET USER ORDERS (Equivalent to getUserOrders)
# =============================================================================

query GetUserOrders($address: ID!, $owner: Address!, $first: Int = 10) {
  node(id: $address) {
    ... on FinPair {
      id
      address
      
      # Get orders for specific user
      orders(first: $first, owner: $owner) {
        edges {
          node {
            id
            owner
            side
            rate
            updatedAt
            offer
            offerValue
            remaining
            remainingValue
            filled
            filledValue
            filledFee
            type
            deviation
            valueUsd
          }
          cursor
        }
        pageInfo {
          hasNextPage
          hasPreviousPage
          startCursor
          endCursor
        }
      }
    }
  }
}

# =============================================================================
# 6. GET RECENT TRADES (Equivalent to trade history)
# =============================================================================

query GetRecentTrades($address: ID!, $first: Int = 20) {
  node(id: $address) {
    ... on FinPair {
      id
      address
      
      trades(first: $first) {
        edges {
          node {
            id
            height
            txIdx
            idx
            contract
            txhash
            quoteAmount
            baseAmount
            price
            type
            protocol
            timestamp
            
            assetBase {
              id
              asset
              metadata {
                symbol
                name
                decimals
              }
            }
            
            assetQuote {
              id
              asset
              metadata {
                symbol
                name
                decimals
              }
            }
          }
          cursor
        }
        pageInfo {
          hasNextPage
          hasPreviousPage
          startCursor
          endCursor
        }
      }
    }
  }
}

# =============================================================================
# 7. GET CANDLESTICK DATA (For price charts)
# =============================================================================

query GetFinCandles($address: ID!, $resolution: String!, $first: Int = 100) {
  node(id: $address) {
    ... on FinPair {
      id
      address
      
      candles(resolution: $resolution, first: $first) {
        edges {
          node {
            id
            resolution
            high
            low
            open
            close
            volume
            bin
          }
          cursor
        }
        pageInfo {
          hasNextPage
          hasPreviousPage
          startCursor
          endCursor
        }
      }
    }
  }
}

