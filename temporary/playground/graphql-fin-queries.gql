# =============================================================================
# USAGE INSTRUCTIONS
# =============================================================================

# WORKING QUERIES (Recommended):
# =============================
# 1. GetAllFinPairsBasic - Basic contract information
# 2. GetAllFinPairsWithOrderbooks - All pairs with orderbook data
# 3. GetAllFinPairsWithSummaries - All pairs with market summaries
# 4. GetAllFinPairsComprehensive - Complete data for all pairs
# 5. GetAllFinPairsWithRecentTrades - All pairs with recent trade history
# 6. GetAllFinPairsWithCandles - All pairs with candlestick data
# 7. FinMarketOverviewSimple - Simplified market overview
# 8. GetAllAssets - Detailed asset information
# 9. GetAllOracles - Oracle price data
# 10. GetAllContracts - Contract deployment information
# 11. GetTradingStatistics - Trading volume and statistics
# 12. GetLiquidityAnalysis - Liquidity depth analysis
# 13. GetPriceFeedData - Price feed information
# 14. GetFeeStructureAnalysis - Fee structure details
# 15. GetDeploymentStatus - Contract deployment status

# BROKEN QUERIES (Not Recommended):
# ================================
# - Any query using node(id: ...) with variables
# - GetFinPairConfig, GetFinOrderbook, GetFinMarketSummary
# - GetUserOrders, GetRecentTrades, GetFinCandles
# - ComprehensiveFinAnalysis with variables
# - Specific pair analysis queries (LQDYBTCAnalysis, etc.)

# HOW TO USE:
# ===========
# 1. Go to https://preview-api.rujira.network/api/graphiql
# 2. Copy any WORKING query above and paste it into the GraphiQL interface
# 3. No variables needed for working queries
# 4. Click the play button to execute the query
# 5. Filter results client-side for specific contracts if needed

# CLIENT-SIDE FILTERING:
# =====================
# To get data for a specific contract, use any working query and filter the results:
# 
# Example (JavaScript):
# const results = await graphqlQuery('GetAllFinPairsComprehensive');
# const lqdyBtc = results.data.rujira.fin.find(
#   pair => pair.address === 'thor1t76lvqjq7avt6kxnul4pt0zaq6y06fhkw29wxs5rm4kt873s6y9sdp8rxf'
# );

# Note: The GraphQL API provides real-time data but may not include all the
# detailed contract simulation features available through direct CosmWasm calls.
# For trade simulation and detailed order placement, you'll still need to use
# the CosmJS playground scripts. 
 