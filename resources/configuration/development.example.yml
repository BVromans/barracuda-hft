rujira:
  endpoints:
    rpc: "https://thornode-mainnet-rpc.bryanlabs.net"
    rest: "https://thornode.ninerealms.com"
    graphql: "https://api.rujira.network/api/graphiql"
  wallet:
    mnemonic: "<mnemonic>" # Optional, but required if privateKey is not provided
    privateKey: "<privateKey>" # Optional, but required if mnemonic is not provided
    publicKeys:
      thor: "<thorPublicKey>" # Optional
      ethereum: "<ethereumPublicKey>" # Optional
  default:
    cache:
      ttlSeconds: 60
    retry:
      maximumNumberOfRetries: 3
      delayBetweenRetries: 1_000
      timeout: 30_000
    orderBook:
      maximumNumberOfOrders: 100 # Optional, leaving empty or null will return all orders
    candles:
      interval: "1m"
      maximumNumberOfCandles: 100 # Optional, leaving empty or null will return all candles
    orders:
      maximumNumberOfOrders: 100 # Optional, leaving empty or null will return all orders
