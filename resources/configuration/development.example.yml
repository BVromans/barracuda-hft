rujira:
  wallet:
    mnemonic: "<wallet mnemonic>" # Optional, but required if privateKey is not provided
    privateKey: "<wallet private key>" # Optional, but required if mnemonic is not provided
    publicKeys:
      thor: "<wallet thor public key>" # Optional
      ethereum: "<wallet ethereum public key>" # Optional
strategy:
  pure_market_making:
    common:
      market: "THOR-RUJI/ETH-USDC"
      tickInterval: 60000 # 1 minute in milliseconds
      orders:
        minimumTokenAmountPerOrder: 0 # Minimum token amount per order
        desiredTokenFreeBalancePercentagePerOrder: 10 # Desired token percentage of the free balance per order (0-100)
        desiredTokenFreeBalanceAmountPerOrder: 1 # Desired token free balance amount per order
        maximumTokenAmountPerOrder: 10 # Maximum token amount per order
      whenStart:
        cancelAllOrders: false
        withdrawAllFilledOrders: false
      whenStop:
        cancelAllOrders: false
        withdrawAllFilledOrders: false
      monitorProfitAndLoss:
        enabled: true
        maximumAllowedWalletLossFromInitialValue: 10 # 1 means 1%
        maximumAllowedWalletLossFromPreviousValue: 10 # 1 means 1%
      tasks:
        updateTokens:
          interval: 21600000 # 6 hours in milliseconds
        updateMarkets:
          interval: 21600000 # 6 hours in milliseconds
        updateIndicators:
          interval: 60000 # 1 minute in milliseconds
        updateOrderBook:
          interval: 30000 # 30 seconds in milliseconds
        monitoreProfitAndLoss:
          interval: 60000 # 1 minute in milliseconds
      logger:
        level: "INFO"
    simple:
      orders:
        spreadPercentage: 10 # 1 means 1%
        buyQuoteTokenAmountPerOrder: 10
        sellBaseTokenAmountPerOrder: 10
    enhanced:
      orders:
        minimumSpreadPercentage: 10 # // Minimum spread as a percentage of the middle price (example: 1 means 1%)
        bollingerBandsWidthSpreadWidthMultiplier: 1.2 # Multiplier for the spread using Bollinger Bands width (≈1.0–1.8)
        volumeWeightedAveragePriceSkewMultiplier: 0.8 # Pull intensity toward the volume weighted average price (≈0.5–1.2)
        maximumSkewPercentage: 0.40 # Maximum absolute skew as a percentage (example: 1 means 1%) (~0.4)
        volatilitySizeShrinkageMultiplier: 4.0 # Multiplier for size shrinkage based on average true range (≈3–6)
