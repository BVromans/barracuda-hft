rujira:
  endpoints:
    rpc: "https://thornode-mainnet-rpc.bryanlabs.net"
    rest: "https://thornode.ninerealms.com"
    graphql: "https://api.rujira.network/api/graphiql"
  cache:
    rujira:
      getThorChainConfiguration: 6 * 60 * 60 # 6 hours
    fin:
      getAllTokens: 6 * 60 * 60 # 6 hours
      getAllMarkets: 6 * 60 * 60 # 6 hours
  constants:
    enum:
      markets:
        active: "LIVE"
    tokens:
      native:
        address: "x/ruji" # Denom
        symbol: "THOR-RUJI"
      usd:
        address: "eth-usdc-0xa0b86991c6218b36c1d19d4a2e9eb0ce3606eb48"  # Denom
        symbol: "ETH-USDC"
      feePayment:
        address: "rune"  # Denom
        symbol: "THOR-RUNE"
        thorChainConfigurationKey: "WASMMINGASPRICE"
  default:
    network:
      gasPrice: '0' # A possible value is '0.02'
    cache:
      ttlSeconds: 60
    parallel:
      batchSize: 10
      delayBetweenBatches: 100
    retry:
      maximumNumberOfRetries: 3
      delayBetweenRetries: 1_000
      timeout: 30_000
    markets:
      loadFromFile: false
      filePath: "resources/graphql/responses/markets.json"
    orderBook:
      maximumNumberOfOrders: 100 # Optional, leaving empty or null will return all orders
    candles:
      interval: "1m"
      maximumNumberOfCandles: 100 # Optional, leaving empty or null will return all candles
    orders:
      maximumSlippagePercentage: 2.5 # 1 means 1%
      maximumNumberOfOrders: 100 # Optional, leaving empty or null will return all orders
tests:
  unit:
    timeout: 10_000 # 10 seconds
  integration:
    timeout: 60_000 # 60 seconds
    transaction:
      hash: "EDF881BCB440DA84C6197C563BB7313FD04AED6D0E477676661B901EEFC87E3E" # Too old transactions cannot be fetched from NineRealms, maybe the hash needs to be updated.
